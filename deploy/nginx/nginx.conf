worker_processes auto;
worker_rlimit_nofile 16384;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    log_format json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"release":"$upstream_http_x_app_version"}';
    access_log /dev/stdout json;

    server_tokens off;
    client_max_body_size 64k;

    # Docker's embedded DNS. Re-resolving keeps routing correct when a container
    # restarts with a new address, and lets nginx start before any app exists.
    resolver 127.0.0.11 valid=2s ipv6=off;

    upstream app_active {
        zone app_active 128k;
        # Rewritten atomically by deploy.sh and healerd.
        include /etc/nginx/upstream/active.conf;
        keepalive 64;
    }

    server {
        listen 80 default_server;

        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://app_active;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_send_timeout 10s;
            proxy_read_timeout 15s;

            # Fail over to the standby release when a backend dies. HTTP 500 is
            # deliberately absent: application bugs must stay visible to metrics.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
        }
    }
}
