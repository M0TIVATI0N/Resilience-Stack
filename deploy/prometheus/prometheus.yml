global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: app
    # The app labels its own series with version and color.
    honor_labels: true
    static_configs:
      - targets: ["app-blue:8080"]
        labels: { color: blue }
      - targets: ["app-green:8080"]
        labels: { color: green }

  - job_name: healer
    static_configs:
      - targets: ["172.30.0.1:9095"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [name]
        regex: app-(blue|green)
        target_label: color
        replacement: $1

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
