---
- name: Build the agent for the server's architecture
  ansible.builtin.command:
    cmd: go build -trimpath -ldflags "-s -w" -o "{{ playbook_dir }}/.build/healerd" ./cmd/healerd
    chdir: "{{ playbook_dir }}/../agent"
  environment:
    CGO_ENABLED: "0"
    GOOS: linux
    GOARCH: "{{ docker_arch_map[ansible_facts['architecture']] }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: Install the agent binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.build/healerd"
    dest: /usr/local/bin/healerd
    owner: root
    group: root
    mode: "0755"
  notify: Restart healerd

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ rs_config_dir }}"
    state: directory
    owner: root
    group: "{{ healer_user }}"
    mode: "0750"

- name: Render the agent environment
  ansible.builtin.template:
    src: healer.env.j2
    dest: "{{ rs_config_dir }}/healer.env"
    owner: root
    group: "{{ healer_user }}"
    mode: "0640"
  no_log: true
  notify: Restart healerd

- name: Install the systemd unit
  ansible.builtin.template:
    src: healerd.service.j2
    dest: /etc/systemd/system/healerd.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart healerd

- name: Enable and start the agent
  ansible.builtin.systemd_service:
    name: healerd
    enabled: true
    state: started
    daemon_reload: true
