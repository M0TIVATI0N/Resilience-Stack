---
# Docker publishes ports through its own iptables chains, which bypass ufw.
# That is why every internal service in stack.yml binds to 127.0.0.1 only.

- name: Allow SSH before the firewall is enabled
  community.general.ufw:
    rule: limit
    port: "{{ ansible_port | default(22) | string }}"
    proto: tcp

- name: Allow public web traffic
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]

- name: Let Alertmanager and Prometheus reach the agent on the host
  community.general.ufw:
    rule: allow
    from_ip: "{{ rs_network_subnet }}"
    to_ip: "{{ rs_network_gateway }}"
    port: "{{ healer_port | string }}"
    proto: tcp

- name: Deny all other incoming traffic
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny
