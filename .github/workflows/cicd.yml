name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Budget for the image's unpacked filesystem, in KiB (25 MiB).
  IMAGE_SIZE_LIMIT_KB: "25600"

jobs:
  test:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [app, agent, tools]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Vet the fault-injection build
        if: matrix.module == 'app'
        run: go vet -tags chaos ./...
      - run: go test -race ./...

  validate:
    name: Validate configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck deploy/scripts/*.sh scripts/*.sh tests/*.sh
      - name: Prometheus configuration and rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Alertmanager configuration
        run: |
          docker run --rm -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Nginx configuration
        run: |
          mkdir -p .ci/upstream
          echo 'server 127.0.0.1:8080;' > .ci/upstream/active.conf
          docker run --rm -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/.ci/upstream:/etc/nginx/upstream:ro" nginx:1.28-alpine nginx -t
      - name: Compose files
        env:
          RS_RUNTIME_DIR: /tmp/rs
          POSTGRES_PASSWORD: ci
          GRAFANA_ADMIN_PASSWORD: ci
          APP_COLOR: blue
          APP_IMAGE: example/parkd:ci
          APP_VERSION: ci
        run: |
          docker compose -f deploy/compose/stack.yml config --quiet
          docker compose -f deploy/compose/app.yml config --quiet

  build:
    name: Build and push image
    needs: [test, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: ${{ vars.DOCKERHUB_REPO }}:${{ steps.meta.outputs.tag }}
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Enforce the image size budget
        env:
          IMAGE: ${{ vars.DOCKERHUB_REPO }}:${{ steps.meta.outputs.tag }}
        run: |
          size=$(docker run --rm --user 0 --entrypoint du "$IMAGE" -sxk / | cut -f1)
          echo "Image size: $((size / 1024)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le "$IMAGE_SIZE_LIMIT_KB"
      - name: Push
        env:
          IMAGE: ${{ vars.DOCKERHUB_REPO }}:${{ steps.meta.outputs.tag }}
        run: docker push "$IMAGE"

  deploy:
    name: Blue-green deploy
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
        # The server's forced command accepts only the commit hash.
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes "deploy@$DEPLOY_HOST" "$TAG"
